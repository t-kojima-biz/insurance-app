# ============================================
# 保険管理アプリ - Production Override
# ============================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================

x-prod-deploy: &prod-deploy
  resources:
    limits:
      memory: 256M
    reservations:
      memory: 64M

services:
  insurance-app:
    build:
      target: runner
    environment:
      TZ: Asia/Tokyo
      NODE_ENV: production
    # Windows bind mounts are owned as root inside the container. The production
    # override keeps only the SQLite data mount, so run this local production
    # service as root to keep the database writable.
    user: root
    init: false
    volumes: !override
      - ./data:/app/data
    healthcheck:
      start_period: 10s
    deploy: *prod-deploy
